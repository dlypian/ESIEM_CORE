
filter {

    if "pan_syslog" in [tags] {

        # Authentication log fields:
        # https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/authentication-log-fields

        if ([message] =~ /AUTH/) {

            csv {
                source => "message"

                columns => [
                    "FUTURE_USE_01",
                    "Receive_Time",
                    "Serial_Number",
                    "Type",
                    "Threat/Content_Type",
                    "FUTURE_USE_02",
                    "Generated_Time",
                    "Virtual_System",
                    "Source_IP",
                    "User",
                    "Normalize_User",
                    "Object",
                    "Authentication_Policy",
                    "Repeat_Count",
                    "Authentication_ID",
                    "Vendor",
                    "Log_Action",
                    "Server_Profile",
                    "Description",
                    "Client_Type",
                    "Event_Type",
                    "Factor_Number",
                    "Sequence_Number",
                    "Action_Flags",
                    "Device_Group_Hierarchy_1",
                    "Device_Group_Hierarchy_2",
                    "Device_Group_Hierarchy_3",
                    "Device_Group_Hierarchy_4",
                    "Virtual_System_Name",
                    "Device_Name",
                    "Virtual_System_ID",
                    "Authentication_Protocol",
                    "UUID_for_rule",
                    "High_Resolution_Timestamp",
                    "Source_Device_Category",
                    "Source_Device_Profile",
                    "Source_Device_Model",
                    "Source_Device_Vendor",
                    "Source_Device_OS_Family",
                    "Source_Device_OS_Version",
                    "Source_Hostname",
                    "Source_Mac_Address",
                    "Region",
                    "FUTURE_USE_03",
                    "User_Agent",
                    "Session_ID",
                    "Cluster_Name"
                ]
            }

            date {
                match => [ "High_Resolution_Timestamp", "ISO8601" ]
                target => "@timestamp"
                tag_on_failure => ["pan_highres_date_failure"]
            }

            # Source GeoIP - skip private IPv4 addresses
            if [Source_IP] and
            [Source_IP] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/ {

                geoip {
                    source => "Source_IP"
                    target => "Source_IP_geo"
                    ecs_compatibility => "disabled"
                }
            }

            mutate {
                convert => {
                    "Sequence_Number" => "integer"
                }

                add_tag => [ "pan_authentication" ]

                # Remove unused reserved fields after parsing
                remove_field => [
                    "FUTURE_USE_01",
                    "FUTURE_USE_02",
                    "FUTURE_USE_03"
                ]
            }
        }
    }
}
