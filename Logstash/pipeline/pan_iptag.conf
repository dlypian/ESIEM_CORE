
filter {

    if "pan_syslog" in [tags] {

        # IP-Tag log fields:
        # https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/ip-tag-log-fields

        if ([message] =~ /IPTAG/) {

            csv {
                source => "message"

                columns => [
                    "FUTURE_USE_01",
                    "Receive_Time",
                    "fw.serial_number",
                    "event.type",
                    "event.subtype",
                    "FUTURE_USE_02",
                    "timestamp",
                    "fw.vsys",
                    "fw.iptag.source.ip",
                    "fw.userid.tag_name",
                    "event.id",
                    "event.repeat_count",
                    "event.timeout",
                    "fw.userid.source_system",
                    "fw.userid.data_source_type",
                    "fw.userid.data_source_subtype",
                    "event.sequence",
                    "fw.log.fwd_panorama",
                    "Device_Group_Hierarchy_Level_1",
                    "Device_Group_Hierarchy_Level_2",
                    "Device_Group_Hierarchy_Level_3",
                    "Device_Group_Hierarchy_Level_4",
                    "fw.vsys_name",
                    "fw.name",
                    "fw.vsys_id",
                    "High_Resolution_Timestamp",
                    "Cluster_Name"
                ]
            }

            date {
                match => [ "High_Resolution_Timestamp", "ISO8601" ]
                target => "@timestamp"
                tag_on_failure => ["pan_highres_date_failure"]
            }

            mutate {
                convert => {
                    "event.sequence" => "integer"
                }

                add_tag => [ "pan_iptag" ]

                # Preserve related device and IP information
                add_field => {
                    "related.serial_number" => [ "%{fw.serial_number}" ]
                    "related.ip"            => [ "%{fw.iptag.source.ip}" ]
                    "related.source.ip"     => [ "%{fw.iptag.source.ip}" ]
                }

                # Remove unused reserved fields after parsing
                remove_field => [
                    "FUTURE_USE_01",
                    "FUTURE_USE_02"
                ]
            }
        }
    }
}
