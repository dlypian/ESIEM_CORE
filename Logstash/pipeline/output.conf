output {
    if "pan_traffic" in [tags] {
        elasticsearch {
            index => "pan_traffic"
            hosts => ["https://es01.${CLIENT_DOMAIN}:9200"]
            ssl_certificate_verification => false

            # ILM
            ilm_enabled => true
            ilm_rollover_alias => "pan_traffic"
            ilm_pattern => "000001"
            ilm_policy => "ES_ILM_pan_traffic"

            # Automatic template management
            manage_template => true
            template => "/usr/share/logstash/templates/pan_traffic.json"
            template_name => "pan_traffic_template"
            template_overwrite => true

            # Authentication
            user => "elastic"
            password => "${ELASTIC_PASSWORD}"
        }
    }
