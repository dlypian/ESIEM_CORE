filter {
    if "fnet_syslog" in [tags] {

        # Remove only the syslog priority prefix
        # Example: <173>date= becomes date=
        mutate {
            gsub => [
                "message", "^<[0-9]+>(?=date=)", ""
            ]
        }

        # Keep original FortiGate fields and values
        kv {
            source => "message"
            field_split => " "
            value_split => "="
            remove_field => ["message"]
        }
    }
}
