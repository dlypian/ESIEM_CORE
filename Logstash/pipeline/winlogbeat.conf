filter {
  if "winlogbeat" in [tags] {

    if [source][ip] {
      mutate {
        copy => { "[source][ip]" => "[source][fqdn]" }
      }

      dns {
        id => "winlogbeat_source_reverse_dns"

        reverse => [ "[source][fqdn]" ]
        action => "replace"
      }
    }

    if [host][ip] {
      mutate {
        copy => { "[host][ip]" => "[host][fqdn]" }
      }
    }

  }
}
