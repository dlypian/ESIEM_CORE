filter {

    if "pan_syslog" in [tags] {

        # System log fields:
        # https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/system-log-fields

        if ([message] =~ /SYSTEM/) {

            csv {
                source => "message"

                columns => [
                    "FUTURE_USE_01",
                    "Receive_Time",
                    "Serial_Number",
                    "Type",
                    "Content/Threat_Type",
                    "FUTURE_USE_02",
                    "Generated_Time",
                    "Virtual_System",
                    "Event_ID",
                    "Object",
                    "FUTURE_USE_03",
                    "FUTURE_USE_04",
                    "Module",
                    "Severity",
                    "Description",
                    "Sequence_Number",
                    "Action_Flags",
                    "Device_Group_Hierarchy_Level_1",
                    "Device_Group_Hierarchy_Level_2",
                    "Device_Group_Hierarchy_Level_3",
                    "Device_Group_Hierarchy_Level_4",
                    "Virtual_System_Name",
                    "Device_Name",
                    "FUTURE_USE_05",
                    "FUTURE_USE_06",
                    "High_Resolution_Timestamp"
                ]
            }

            date {
                match => [ "High_Resolution_Timestamp", "ISO8601" ]
                target => "@timestamp"
                tag_on_failure => ["pan_highres_date_failure"]
            }

            mutate {
                add_tag => [ "pan_system" ]

                # Remove unused reserved fields after parsing
                remove_field => [
                    "FUTURE_USE_01",
                    "FUTURE_USE_02",
                    "FUTURE_USE_03",
                    "FUTURE_USE_04",
                    "FUTURE_USE_05",
                    "FUTURE_USE_06"
                ]
            }
        }
    }
}
