
filter {

    if "pan_syslog" in [tags] {

        # GlobalProtect log fields:
        # https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/globalprotect-log-fields

        if ([message] =~ /GLOBALPROTECT/) {

            csv {
                source => "message"

                columns => [
                    "FUTURE_USE_01",
                    "Receive_Time",
                    "Serial_Number",
                    "Type",
                    "Threat/Content_Type",
                    "FUTURE_USE_02",
                    "Generated_Time",
                    "Virtual_System",
                    "Event_ID",
                    "Stage",
                    "Authentication_Method",
                    "Tunnel_Type",
                    "Source_User",
                    "Source_Region",
                    "Machine_Name",
                    "Public_IP",
                    "Public_IPv6",
                    "Private_IP",
                    "Private_IPv6",
                    "Host_ID",
                    "User_Device_Serial_Number",
                    "Client_Version",
                    "Client_OS",
                    "Client_OS_Version",
                    "Repeat_Count",
                    "Reason",
                    "Error",
                    "Description",
                    "Status",
                    "Location",
                    "Login_Duration",
                    "Connect_Method",
                    "Error_Code",
                    "Portal",
                    "Sequence_Number",
                    "Action_Flags",
                    "High_Resolution_Timestamp",
                    "Selection_Type",
                    "Response_Time",
                    "Priority",
                    "Attempted_Gateways",
                    "Gateway",
                    "Device_Group_Hierarchy_Level_1",
                    "Device_Group_Hierarchy_Level_2",
                    "Device_Group_Hierarchy_Level_3",
                    "Device_Group_Hierarchy_Level_4",
                    "Virtual_System_Name",
                    "Device_Name",
                    "Virtual_System_ID",
                    "Cluster_Name"
                ]
            }

            date {
                match => [ "High_Resolution_Timestamp", "ISO8601" ]
                target => "@timestamp"
                tag_on_failure => ["pan_highres_date_failure"]
            }

            # Public GeoIP - skip private IPv4 addresses
            if [Public_IP] and
            [Public_IP] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/ {

                geoip {
                    source => "Public_IP"
                    target => "Public_IP_geo"
                    ecs_compatibility => "disabled"
                }
            }

            mutate {
                convert => {
                    "Sequence_Number" => "integer"
                }

                add_tag => [ "pan_globalprotect" ]

                # Remove unused reserved fields after parsing
                remove_field => [
                    "FUTURE_USE_01",
                    "FUTURE_USE_02"
                ]
            }
        }
    }
}
