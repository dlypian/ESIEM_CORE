
filter {

    if "pan_syslog" in [tags] {

        # HIP Match log fields:
        # https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/hip-match-log-fields

        if ([message] =~ /HIP-MATCH/) {

            csv {
                source => "message"

                columns => [
                    "FUTURE_USE_01",
                    "Receive_Time",
                    "fw.serial_number",
                    "event.type",
                    "event.subtype",
                    "FUTURE_USE_02",
                    "timestamp",
                    "fw.hip.source.user",
                    "fw.vsys",
                    "fw.hip.client.hostname",
                    "fw.hip.host_os",
                    "fw.hip.source.ip",
                    "fw.hip.name",
                    "event.repeat_count",
                    "fw.hip.type",
                    "FUTURE_USE_03",
                    "FUTURE_USE_04",
                    "event.sequence",
                    "fw.log.fwd_panorama",
                    "Device_Group_Hierarchy_Level_1",
                    "Device_Group_Hierarchy_Level_2",
                    "Device_Group_Hierarchy_Level_3",
                    "Device_Group_Hierarchy_Level_4",
                    "fw.vsys_name",
                    "fw.name",
                    "fw.vsys_id",
                    "fw.hip.ipv6_source",
                    "fw.hip.host_id",
                    "fw.hip.device_serial_number",
                    "fw.hip.device_mac_address",
                    "High_Resolution_Timestamp",
                    "Cluster_Name"
                ]
            }

            date {
                match => [ "High_Resolution_Timestamp", "ISO8601" ]
                target => "@timestamp"
                tag_on_failure => ["pan_highres_date_failure"]
            }

            mutate {
                convert => {
                    "event.sequence" => "integer"
                }

                add_tag => [ "pan_hip" ]

                # Remove unused reserved fields after parsing
                remove_field => [
                    "FUTURE_USE_01",
                    "FUTURE_USE_02",
                    "FUTURE_USE_03",
                    "FUTURE_USE_04"
                ]
            }
        }
    }
}
